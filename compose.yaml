name: dive-centre
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    build:
      context: ./backend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTHENTICATOR_ENCRYPTION_KEY_FILE: /run/secrets/authenticator_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}}
      PMS_API_KEY_FILE: /run/secrets/pms_api_key
      TRUST_PROXY: "1"
    secrets:
      - database_url
      - authenticator_key
      - jwt_secret
      - pms_api_key
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:-ops@dive-centre.local}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  database_password:
    file: ./secrets/database_password
  database_url:
    file: ./secrets/database_url
  authenticator_key:
    file: ./secrets/authenticator_key
  jwt_secret:
    file: ./secrets/jwt_secret
  admin_password:
    file: ./secrets/admin_password
  pms_api_key:
    file: ./secrets/pms_api_key
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
