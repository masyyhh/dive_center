# Temporary unrestricted source access. Use instead of the restricted override,
# not together with it. The external proxy remains responsible for HTTPS.
services:
  backend:
    environment:
      TRUST_PROXY: "0"
      TRUST_PROXY_ADDRESSES: !reset null
      REQUIRE_TRUSTED_PROXY: "0"
    ports:
      - "0.0.0.0:5001:5001"
  web:
    ports: !override
      - "0.0.0.0:8080:8080"
    volumes:
      - ./deploy/Caddyfile.reverse-proxy:/etc/caddy/Caddyfile:ro
    cap_drop: [ALL]
    # The official Caddy binary carries cap_net_bind_service. Keep that
    # capability in its bounding set so exec succeeds, even on port 8080.
    cap_add: [NET_BIND_SERVICE]
